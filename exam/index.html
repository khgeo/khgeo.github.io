<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ធ្វើការប្រឡង · Take an exam</title>
<meta name="description" content="Department of Geography and Land Management, Royal University of Phnom Penh">
<meta name="robots" content="noindex">
<link rel="icon" href="https://www.gstatic.com/images/icons/material/system/2x/school_black_48dp.png">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#F4F6F5}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
  #slow{position:fixed;left:0;right:0;bottom:16px;text-align:center;font:13px system-ui,sans-serif;color:#6B7A80;display:none}
  #slow a{color:#0F6E6E;font-weight:600}
</style>
</head>
<body>
<!-- The grading system is shown inside this page, so people stay on this address. -->
<iframe id="app" title="Grading System" allow="camera; microphone; clipboard-read; clipboard-write; fullscreen"></iframe>
<div id="slow">Taking long to open? <a id="direct" target="_top">Open it directly</a></div>
<script>
  /* The web app's /exec address. If you ever make a NEW deployment, paste its link here. */
  var APP = "https://script.google.com/macros/s/AKfycbwAWO4UOoiQpeto5OWjgSO8o9OYHh9vuDdBzfcWM6GwdnVaZXn_KmRcosSgz1ZG0u8G0g/exec";
  var q = location.search || "?exam=1";
  var src = APP + q;
  document.getElementById("app").src = src;
  document.getElementById("direct").href = src;
  var loaded = false;
  document.getElementById("app").addEventListener("load", function () { loaded = true; });
  setTimeout(function () { if (!loaded) document.getElementById("slow").style.display = "block"; }, 12000);
  /* The app tells this page which page it shows, so reloading this address returns there. */
  window.addEventListener("message", function (e) {
    var host = "";
    try { host = new URL(e.origin).hostname; } catch (x) { return; }
    if (!/(^|\.)script\.google\.com$|\.googleusercontent\.com$/.test(host)) return;
    var d = e.data;
    if (!d || typeof d.gsUrl !== "object") return;
    var p = new URLSearchParams();
    Object.keys(d.gsUrl).forEach(function (k) { p.set(k, String(d.gsUrl[k])); });
    var s = p.toString();
    history.replaceState(null, "", location.pathname + (s ? "?" + s : ""));
  });
</script>
<noscript><p style="font-family:sans-serif;padding:20px">Please turn on JavaScript, or <a href="https://script.google.com/macros/s/AKfycbwAWO4UOoiQpeto5OWjgSO8o9OYHh9vuDdBzfcWM6GwdnVaZXn_KmRcosSgz1ZG0u8G0g/exec?exam=1">open the grading system directly</a>.</p></noscript>
</body>
</html>
